aid: fhenix
name: Fhenix
description: >-
  Fhenix is a blockchain R&D company building confidential computing for
  EVM-compatible chains using Fully Homomorphic Encryption (FHE). Its CoFHE (FHE
  Coprocessor) lets Solidity smart contracts compute directly on encrypted data
  — encrypt inputs client-side, operate on ciphertexts on-chain via the FHE.sol
  Solidity libraries, and unseal results through a threshold decryption network,
  so sensitive state stays private without ever being decrypted on-chain. The
  developer stack is a smart-contract-plus-client-library surface (not a REST
  API): the cofhejs TypeScript SDK, Hardhat/Foundry plugins and starters, the
  fhenix-contracts Solidity libraries, and mock contracts for local testing.
  CoFHE is live on public testnets (Ethereum Sepolia, Arbitrum Sepolia, Base
  Sepolia) with mainnet planned. Fhenix is backed by Multicoin Capital.
